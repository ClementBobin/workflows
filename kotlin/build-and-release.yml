name: Build All Platforms

on:
  workflow_run:
    workflows: ["Resolve Version"]
    types:
      - completed

# Centralized configuration variables
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # Check if the previous run was successful and actually triggered a release
  check-status:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-info.outputs.version }}
      version_code: ${{ steps.get-info.outputs.version_code }}
      will_release: ${{ steps.get-info.outputs.will_release }}
    steps:
    - name: Verify parent workflow success
      if: ${{ github.event.workflow_run.conclusion == 'success' }}
      run: echo "Parent workflow passed successfully."
      
    # Fetch outputs from the completed workflow run via GitHub REST API
    - name: Fetch Workflow Outputs
      id: get-info
      uses: actions/github-script@v7
      with:
        script: x => {
          const runId = context.payload.workflow_run.id;
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          
          const jobs = await github.rest.actions.listJobsForWorkflowRun({
            owner, repo, run_id: runId
          });
          
          const resolveJob = jobs.data.jobs.find(j => j.name === 'resolve-version');
          if (resolveJob) {
            // Access the outputs of the resolve-version job
            const outputs = resolveJob.outputs;
            if (outputs) {
              // Return the outputs as a JavaScript object
              return {
                version: outputs.version,
                version_code: outputs.version_code,
                will_release: outputs.will_release
              };
            }
          }
          // For simplicity in cross-workflow dependencies, we can fall back to reading git tags or passing via artifacts if needed, 
          // or we can structure using repository_dispatch.
        }

  # ─────────────────────────────────────────────
  # Build Android (APK & AAB)
  # ─────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: gradle
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Write local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
    - name: Decode Keystore & Build Android
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.keystore
        ./gradlew :composeApp:assembleRelease :composeApp:bundleRelease \
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}
    - name: Upload Android Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-artifacts
        path: |
          */*/build/outputs/apk/release/*.apk
          */*/build/outputs/bundle/release/*.aab

  # ─────────────────────────────────────────────
  # Build iOS (Requires macOS)
  # ─────────────────────────────────────────────
  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: gradle
    - name: Build iOS App / IPA
      run: |
        ./gradlew :composeApp:linkReleaseFrameworkIosArm64 || true
    - name: Upload iOS Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-artifacts
        path: |
          iosApp/build/Knu*.ipa
          **/build/outputs/ios/*.ipa

  # ─────────────────────────────────────────────
  # Build Web (Wasm / JS)
  # ─────────────────────────────────────────────
  build-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: gradle
    - name: Build Compose Web Target
      run: |
        ./gradlew :composeApp:wasmJsBrowserDistribution
    - name: Upload Web Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: web-artifacts
        path: composeApp/build/dist/wasmJs/productionExecutable/

  # ─────────────────────────────────────────────
  # Build Desktop Matrix (Linux, macOS, Windows)
  # ─────────────────────────────────────────────
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            task: packageDmg
          - os: macos-latest
            platform: macos
            task: packageDmg
          - os: windows-latest
            platform: windows
            task: packageMsi
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: gradle
    - name: Build Desktop Distribution (${{ matrix.platform }})
      run: |
        ./gradlew :composeApp:${{ matrix.task }}
    - name: Upload Desktop Artifacts (${{ matrix.platform }})
      uses: actions/upload-artifact@v4
      with:
        name: desktop-${{ matrix.platform }}-artifacts
        path: |
          composeApp/build/compose/binaries/main/dmg/*.dmg
          composeApp/build/compose/binaries/main/msi/*.msi
          composeApp/build/compose/binaries/main/deb/*.deb
          composeApp/build/compose/binaries/main/rpm/*.rpm
          composeApp/build/compose/binaries/main/exe/*.exe
          composeApp/build/compose/binaries/main/zip/*.zip