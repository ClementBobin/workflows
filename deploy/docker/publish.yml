name: Build and Push Docker Image

on:
  workflow_run:
    workflows: ["🔍 1. Resolve Version"]
    types:
      - completed
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: test/api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Only run if triggered directly (push/PR) OR if the workflow_run successfully completed
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If triggered by workflow_run, extract the version output from the "Resolve Version" workflow
      - name: Get Resolved Version
        id: version
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get jobs of the completed workflow run
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: runId
            });
            
            const resolveJob = jobs.data.jobs.find(j => j.name === 'resolve-version');
            if (!resolveJob) {
              console.log("Could not find resolve-version job.");
              return;
            }
            
            // Get step outputs from the resolve-version job
            const step = resolveJob.steps.find(s => s.name === 'Determine next version (dry-run)');
            // Alternatively, we can query workflow run outputs if defined at job level, 
            // but let's read it cleanly or fallback to fetching the tag/git log.
            
            // A simpler, bulletproof way to get the version when triggered via workflow_run:
            // Read it directly from the repo's latest git tag since semantic-release just pushed it.
            const { execSync } = require('child_process');
            let version = "latest";
            try {
              version = execSync('git describe --tags --abbrev=0 2>/dev/null').toString().trim().replace(/^v/, '');
            } catch (e) {
              console.log("No tag found, falling back.");
            }
            
            console.log(`Resolved Version: ${version}`);
            core.setOutput('app_version', version);

      # For direct pushes/PRs (not via workflow_run), fallback to standard tags
      - name: Set Fallback Version for Push/PR
        id: fallback-version
        if: github.event_name != 'workflow_run'
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "latest")
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.vercel
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event_name == 'workflow_run' && steps.version.outputs.app_version || steps.fallback-version.outputs.app_version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}